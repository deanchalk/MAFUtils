name: NuGet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version for both packages, e.g. 0.5.0-rc.1; blank uses each project version'
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      MAFUTILS_TEST_SQLSERVER: 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;Encrypt=true;TrustServerCertificate=true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'SQL Server LocalDB failed to start.' }
      - name: Test, pack, inspect and consume both packages
        id: packages
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$') {
              throw 'Release tags must look like v0.4.0 or v0.4.0-rc.1.'
            }
            $version = $Matches[1]
          }
          ./scripts/Build-Package.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ${{ steps.packages.outputs.package-directory }}/*.nupkg
            ${{ steps.packages.outputs.package-directory }}/*.snupkg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/validation/**/*.trx
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - name: Get short-lived NuGet publishing credentials
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish both validated packages and symbols
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $packages = @(Get-ChildItem packages -Recurse -Filter '*.nupkg')
          $symbols = @(Get-ChildItem packages -Recurse -Filter '*.snupkg')
          if ($packages.Count -ne 2 -or $symbols.Count -ne 2) { throw 'Expected exactly two validated packages and symbol packages.' }
          $release = foreach ($id in @('MAFUtils.SqlServer', 'MAFUtils.Tools')) {
            $match = @($packages | Where-Object Name -CEQ "$id.$version.nupkg")
            if ($match.Count -ne 1) { throw "Missing or mismatched package: $id $version" }
            if (-not (Test-Path -LiteralPath (Join-Path $match[0].DirectoryName "$id.$version.snupkg"))) {
              throw "Missing symbols: $id $version"
            }
            $match[0]
          }
          # A rerun can finish a partially successful release without replacing published versions.
          foreach ($package in $release) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed for $($package.Name)." }
          }
